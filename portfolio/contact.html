<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Portfolio</title>
  <meta name="description" content="[PLACEHOLDER: short meta description for Contact page]" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='64'%20height='64'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%237C5CFF'/%3E%3Cpath%20d='M18%2032%20c0-9.5%207.7-17%2018-17s18%207.5%2018%2017-7.7%2017-18%2017-18-7.5-18-17Z'%20fill='%230B1220'/%3E%3Cpath%20d='M24%2042%20V22h8.2c4.6%200%207.6%202.7%207.6%207%200%204.3-3%207-7.6%207H24Z'%20fill='%23EAF2FF'/%3E%3C/svg%3E" />

<body data-page="contact">
  <link rel="stylesheet" href="css/styles.css" />
  <header id="site-header"></header>

  <main id="main" tabindex="-1">
    <section class="section">
      <div class="container">
        <div class="contact-layout">
          <aside id="contact-details" class="panel"></aside>

          <div>
            <h1 class="page-title">Contact</h1>
            <p class="muted">Use the form below—your email client will open with your message.</p>

            <form data-contact-form="1" method="post">
              <div class="form-grid">
                <div>
                  <label for="name">Name</label>
                  <input id="name" name="name" type="text" autocomplete="name" required />
                </div>

                <div>
                  <label for="email">Email</label>
                  <input id="email" name="email" type="email" autocomplete="email" required />
                </div>

                <div class="span-2">
                  <label for="topic">Topic</label>
                  <select id="topic" name="topic" required>
                    <option value="" disabled selected>[PLACEHOLDER: choose a topic]</option>
                    <option value="Project inquiry">Project inquiry</option>
                    <option value="Collaboration">Collaboration</option>
                    <option value="General message">General message</option>
                  </select>
                </div>

                <div class="span-2">
                  <label for="message">Message</label>
                  <textarea id="message" name="message" required placeholder="[PLACEHOLDER: write your message]"></textarea>
                </div>
              </div>

              <div class="form-actions">
                <button class="submit" type="submit">Send via email</button>
                <span class="helper">No data is stored. Mailto opens your email app—do not submit fake confirmations.</span>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <div id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Image preview" style="display:none;"></div>

  <script type="module">
    import { initSite } from './js/site.js';
    initSite();
  </script>
</body>
</html>
